name: Deploy

# Deploys the hosted MCP server to Fly.io (app + region in fly.toml) on every push to main,
# after a smoke test of /health. Requires the repo secret FLY_API_TOKEN
# (create with: fly tokens create deploy -a loadingmcp-mcp).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS https://mcp.loadingmcp.com/health && exit 0
            sleep 10
          done
          echo "::error::health check failed after deploy"
          exit 1
