name: Deploy

# Deploys your own copy of the server to Fly.io. Manual by default so a fresh fork never fails;
# once FLY_API_TOKEN is set, pushes to main deploy automatically.
#
# One-time setup (see README "Run your own copy"):
#   1. fly apps create <your-unique-app-name>
#   2. fly tokens create deploy -a <your-unique-app-name>   -> repo secret FLY_API_TOKEN
#   3. repo variable FLY_APP = <your-unique-app-name>
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$FLY_API_TOKEN" ] || [ -z "$FLY_APP" ]; then
            echo "::notice::FLY_API_TOKEN secret and/or FLY_APP variable not set - skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.cfg.outputs.ready == 'true'

      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        run: flyctl deploy --remote-only --app "$FLY_APP"

      - name: Smoke test deployed app
        if: steps.cfg.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            scripts/smoke.sh "https://${FLY_APP}.fly.dev" && exit 0
            sleep 10
          done
          echo "::error::smoke test failed after deploy"
          exit 1
